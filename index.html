<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparación de Presión Hidrostática</title>
    <link rel="stylesheet" href="variables.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <nav class="d-flex justify-content-center navbar">
      <h2>Presión Hidroestatica o Manométrica</h2>
    </nav>
    <hr>
    
    <div class="container d-flex flex-column align-items-center text-center">
      <h1 class="mb-2">Ph = ρ * g * h</h1>
      <p class="mb-0 text-muted fs-5">
        <strong>ρ:</strong> Densidad del fluido |
        <strong>g:</strong> Aceleración de la gravedad |
        <strong>h:</strong> Altura o profundidad
      </p>
    </div>
    <hr>
    
    <h5 class="text-center">Selecciona los fluidos para comparar</h5>
    
    <div class="container py-4">
        <div class="row justify-content-center g-4">
          
          <div class="col-md-5 text-center p-3 border rounded shadow-sm bg-light">
            <h4>Vaso 1</h4>
            <select id="selectLiquido1" class="form-select mb-3" onchange="comparar()">
              <option value="agua" selected>Aguaㅤㅤㅤ1000 kg/m³</option>
              <option value="aceite">Aceiteㅤㅤㅤ850 kg/m³</option>
              <option value="mercurio">Mercurioㅤㅤㅤ13546 kg/m³</option>
              <option value="alcohol">Alcoholㅤㅤㅤ789 kg/m³</option>
              <option value="glicerina">Glicerinaㅤㅤㅤ1260 kg/m³</option>
              <option value="parafina">Parafinaㅤㅤㅤ810 kg/m³</option>
              <option value="gasolina">Gasolinaㅤㅤㅤ720 kg/m³</option>
            </select>
            
            <div class="cup mx-auto">
              <div id="fill1" class="fill" style="height: 90%;">
                <div id="ball1" class="ball"></div>
              </div>
            </div>

            <div class="my-2 px-3">
              <label for="alturaLiquido1" class="form-label fw-bold mb-0" style="font-size: 0.85rem;">
                Altura: <span id="valorAltura1">1.00</span> m
              </label>
              <input 
                type="range"
                id="alturaLiquido1"
                class="form-range form-range-sm"
                min="0.1"
                max="2"
                step="0.01"
                value="1"
                oninput="cambiarAltura(1, this.value)"
              >
            </div>

            <p id="nombreLiquido1" class="mt-1 fw-bold">Agua</p>
            <p id="presion1" class="text-primary fw-bold">Presión: - Pa</p>
          </div>

          <div class="col-md-5 text-center p-3 border rounded shadow-sm bg-light">
            <h4>Vaso 2</h4>
            <select id="selectLiquido2" class="form-select mb-3" onchange="comparar()">
              <option value="agua" selected>Aguaㅤㅤㅤ1000 kg/m³</option>
              <option value="aceite">Aceiteㅤㅤㅤ850 kg/m³</option>
              <option value="mercurio">Mercurioㅤㅤㅤ13546 kg/m³</option>
              <option value="alcohol">Alcoholㅤㅤㅤ789 kg/m³</option>
              <option value="glicerina">Glicerinaㅤㅤㅤ1260 kg/m³</option>
              <option value="parafina">Parafinaㅤㅤㅤ810 kg/m³</option>
              <option value="gasolina">Gasolinaㅤㅤㅤ720 kg/m³</option>
            </select>

            <div class="cup mx-auto">
              <div id="fill2" class="fill" style="height: 90%;">
                <div id="ball2" class="ball"></div>
              </div>
            </div>

            <div class="my-2 px-3">
              <label for="alturaLiquido2" class="form-label fw-bold mb-0" style="font-size: 0.85rem;">
                Altura: <span id="valorAltura2">1.00</span> m
              </label>
              <input 
                type="range"
                id="alturaLiquido2"
                class="form-range form-range-sm"
                min="0.1"
                max="2"
                step="0.01"
                value="1"
                oninput="cambiarAltura(2, this.value)"
              >
            </div>

            <p id="nombreLiquido2" class="mt-1 fw-bold">Aceite</p>
            <p id="presion2" class="text-primary fw-bold">Presión: - Pa</p>
          </div>

        </div>
    </div>

    <div class="d-flex justify-content-center mt-2 mb-4">
        <button class="btn btn-success btn-lg" onclick="comparar()">Comparar Fluidos</button>
    </div>

    <script src="fluidos.js"></script>
    <script src="cambiar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
