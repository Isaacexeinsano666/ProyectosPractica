<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>index</title>
    <link rel="stylesheet" href="variables.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <nav class="d-flex justify-content-center navbar">
    <h2>Presión hidroestatica</h2>
  </nav>
  <hr>
  <body>
    <h5 class="d-flex justify-content-center">Cambios en la altura y fluidos</h5>
    <div class="container py-4">
        <div class="row justify-content-center g-4">
          <div class="col-4 text-center">
            <div class="cup">
              <div class="fill agua" style="height: 90%;"></div>
            </div>
            <p class="mt-2">Agua</p>
          </div>
          <div class="col-4 text-center">
            <div class="cup">
              <div class="fill aceite" style="height: 90%;"></div>
            </div>
            <p class="mt-2">Aceite</p>
          </div>
          <div class="col-4 text-center">
            <div class="cup">
              <div class="fill mercurio" style="height: 90%;"></div>
            </div>
            <p class="mt-2">Mercurio</p>
          </div>
        </div>
    </div>
    <div class="d-flex justify-content-center">
        <button class="btn btn-success" onclick="cambiar()">Cambiar</button>
    </div>
    <script src="fluidos.js"></script>
    <script src="cambiar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
