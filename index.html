<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparación de Presión Hidrostática</title>
    <link rel="stylesheet" href="variables.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <nav class="d-flex justify-content-center navbar">
    <h2>Comparación de Presión Hidrostática</h2>
  </nav>
  <hr>
  <body>
      <div class="container d-flex justify-content-center">
        <img src="./Formula Presión Hidroestatica..jpg" alt="">
      </div>
      <hr>
      <h5 class="text-center">Selecciona los fluidos para comparar</h5>
    <div class="container py-4">
        <div class="row justify-content-center g-4">
          
          <div class="col-md-5 text-center p-3 border rounded shadow-sm bg-light">
            <h4>Vaso 1</h4>
            <select id="selectLiquido1" class="form-select mb-3">
              <option value="agua" selected>Aguaㅤㅤㅤ1000 kg/m³</option>
              <option value="aceite">Aceiteㅤㅤㅤ850 kg/m³</option>
              <option value="mercurio">Mercurioㅤㅤㅤ13546 kg/m³</option>
              <option value="alcohol">Alcoholㅤㅤㅤ789 kg/m³</option>
              <option value="glicerina">Glicerinaㅤㅤㅤ1260 kg/m³</option>
              <option value="parafina">Parafinaㅤㅤㅤ810 kg/m³</option>
              <option value="gasolina">Gasolinaㅤㅤㅤ720 kg/m³</option>
            </select>
            <div class="cup mx-auto">
              <div id="fill1" class="fill" style="height: 90%;">
                <div id="ball1" class="ball"></div>
              </div>
            </div>
            <p id="nombreLiquido1" class="mt-2 fw-bold">Agua</p>
            <p id="presion1" class="text-primary fw-bold">Presión: - Pa</p>
          </div>
          <div class="col-md-5 text-center p-3 border rounded shadow-sm bg-light">
            <h4>Vaso 2</h4>
            <select id="selectLiquido2" class="form-select mb-3">
              <option value="agua" selected>Aguaㅤㅤㅤ1000 kg/m³</option>
              <option value="aceite">Aceiteㅤㅤㅤ850 kg/m³</option>
              <option value="mercurio">Mercurioㅤㅤㅤ13546 kg/m³</option>
              <option value="alcohol">Alcoholㅤㅤㅤ789 kg/m³</option>
              <option value="glicerina">Glicerinaㅤㅤㅤ1260 kg/m³</option>
              <option value="parafina">Parafinaㅤㅤㅤ810 kg/m³</option>
              <option value="gasolina">Gasolinaㅤㅤㅤ720 kg/m³</option>
            </select>
            <div class="cup mx-auto">
              <div id="fill2" class="fill" style="height: 90%;">
                <div id="ball2" class="ball"></div>
              </div>
            </div>
            <p id="nombreLiquido2" class="mt-2 fw-bold">Aceite</p>
            <p id="presion2" class="text-primary fw-bold">Presión: - Pa</p>
          </div>
        </div>
    </div>
    <div class="container text-center my-3">
      <label for="alturaLiquido" class="form-label fw-bold">
        Altura del líquido
      </label>
    <input 
        type="range"
        id="alturaLiquido"
        class="form-range"
        min="0.1"
        max="2"
        step="0.01"
        value="1"
        oninput="cambiarAltura(this.value)"
    >
      <p>
         Altura: <span id="valorAltura">1.00</span> m
      </p>
    </div>
    <div class="d-flex justify-content-center mt-3">
        <button class="btn btn-success btn-lg" onclick="comparar()">Comparar Fluidos</button>
    </div>
    <script src="fluidos.js"></script>
    <script src="cambiar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
